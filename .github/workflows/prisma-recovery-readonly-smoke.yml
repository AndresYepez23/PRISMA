name: Prisma recovery runtime smoke (read-only)
on:
  push:
    branches:
      - recovery/known-good-17a6c338
permissions:
  contents: read
jobs:
  verify-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare immutable deployment credential inventories without secrets
        run: node prisma/scripts/recovery-runtime-smoke.mjs
      - name: Qwen one-shot inference against working production deployment
        if: contains(github.event.head_commit.message, '[qwen-smoke-once]')
        env:
          ONE_QWEN_PROBE: '1'
        run: node prisma/scripts/recovery-runtime-smoke.mjs
